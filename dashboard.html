<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>تسجيل الدخول - ALPHA ACADEMY</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap"
        rel="stylesheet"
    >

    <style>

        * {
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background: #080f1e;
            color: white;
            min-height: 100vh;
        }

        /* ================= HEADER ================= */

        header {
            background: #101e3a;
            border-bottom: 1px solid rgba(0, 210, 255, 0.25);

            padding: 18px 25px;

            display: flex;
            justify-content: space-between;
            align-items: center;

            gap: 15px;
        }

        .logo {
            color: #00d2ff;
            font-size: 1.3rem;
            font-weight: 800;
            cursor: pointer;
            user-select: none;
        }

        .header-buttons {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        #home-btn,
        #register-btn {
            border: none;
            padding: 9px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
            transition: 0.3s;
        }

        /* زر الرئيسية */

        #home-btn {
            background: transparent;
            color: white;
            border: 1px solid rgba(0, 210, 255, 0.4);
        }

        #home-btn:hover {
            background: rgba(0, 210, 255, 0.1);
        }

        /* زر إنشاء حساب */

        #register-btn {
            background: #00d2ff;
            color: #040914;
        }

        #register-btn:hover {
            background: #33dcfb;
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.5);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* ================= MAIN ================= */

        main {
            max-width: 450px;
            margin: 60px auto;
            padding: 0 20px;
        }

        /* ================= LOGIN FORM ================= */

        .login-card {
            background: #101e3a;

            border: 1px solid rgba(0, 210, 255, 0.25);

            border-radius: 16px;

            padding: 30px;

            box-shadow: 0 0 25px rgba(0, 210, 255, 0.08);
        }

        .login-card h2 {
            color: #00d2ff;
            margin-bottom: 8px;
            font-size: 1.6rem;
            text-align: center;
        }

        .login-card p {
            color: #94a3b8;
            text-align: center;
            margin-bottom: 25px;
            font-size: 0.95rem;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #94a3b8;
            font-size: 0.9rem;
        }

        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border-radius: 8px;
            border: 1px solid rgba(0, 210, 255, 0.2);
            background: #040914;
            color: white;
            outline: none;
            font-size: 1rem;
            transition: 0.3s;
        }

        .form-group input:focus {
            border-color: #00d2ff;
            box-shadow: 0 0 10px rgba(0, 210, 255, 0.2);
        }

        #submit-btn {
            width: 100%;
            padding: 12px;
            background: #00d2ff;
            color: #040914;
            border: none;
            border-radius: 8px;
            font-weight: 800;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 10px;
            transition: 0.3s;
        }

        #submit-btn:hover {
            background: #33dcfb;
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.4);
        }

        /* ================= ERROR ================= */

        #error {
            display: none;
            text-align: center;
            margin-bottom: 20px;
            background: rgba(255, 82, 82, 0.1);
            color: #ff5252;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid rgba(255, 82, 82, 0.2);
            font-size: 0.9rem;
        }

        /* ================= FOOTER LINK ================= */

        .auth-footer {
            text-align: center;
            margin-top: 20px;
            color: #94a3b8;
            font-size: 0.9rem;
        }

        .auth-footer a {
            color: #00d2ff;
            text-decoration: none;
            font-weight: 700;
        }

        .auth-footer a:hover {
            text-decoration: underline;
        }

        /* ================= MOBILE ================= */

        @media (max-width: 600px) {

            header {
                padding: 15px;
            }

            .logo {
                font-size: 1rem;
            }

            .header-buttons {
                gap: 6px;
            }

            #home-btn,
            #register-btn {
                padding: 8px 10px;
                font-size: 0.8rem;
            }

            main {
                margin: 30px auto;
                padding: 0 15px;
            }

            .login-card {
                padding: 20px;
            }

            .login-card h2 {
                font-size: 1.3rem;
            }

        }

    </style>

</head>


<body>


<!-- =========================================================
     HEADER
========================================================= -->

<header>

    <div
        class="logo"
        id="home-logo"
    >
        ALPHA ACADEMY
    </div>


    <div class="header-buttons">

        <button id="home-btn">
            الرئيسية
        </button>


        <button id="register-btn">
            إنشاء حساب
        </button>

    </div>

</header>



<!-- =========================================================
     MAIN
========================================================= -->

<main>

    <div class="login-card">

        <h2>تسجيل الدخول</h2>

        <p>أدخل بيانات حسابك للوصول إلى المنصة</p>


        <!-- Error Message -->

        <div id="error"></div>


        <!-- Login Form -->

        <form id="login-form">

            <div class="form-group">
                <label for="email">البريد الإلكتروني</label>
                <input
                    type="email"
                    id="email"
                    placeholder="example@domain.com"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">كلمة المرور</label>
                <input
                    type="password"
                    id="password"
                    placeholder="••••••••"
                    required
                >
            </div>

            <button
                type="submit"
                id="submit-btn"
            >
                تسجيل الدخول
            </button>

        </form>

        <div class="auth-footer">
            ليس لديك حساب؟
            <a href="./register.html">أنشئ حسابك الآن</a>
        </div>

    </div>

</main>



<!-- =========================================================
     JAVASCRIPT
========================================================= -->

<script type="module">

    // =========================================================
    // استيراد Supabase
    // =========================================================

    import {
        supabase
    } from '../js/supabase.js';


    // =========================================================
    // عناصر الصفحة
    // =========================================================

    const loginForm =
        document.getElementById('login-form');

    const emailInput =
        document.getElementById('email');

    const passwordInput =
        document.getElementById('password');

    const submitButton =
        document.getElementById('submit-btn');

    const errorBox =
        document.getElementById('error');

    const homeButton =
        document.getElementById('home-btn');

    const registerButton =
        document.getElementById('register-btn');

    const homeLogo =
        document.getElementById('home-logo');


    // =========================================================
    // التنقل
    // =========================================================

    function goHome() {
        window.location.href = '../index.html';
    }

    homeButton.addEventListener('click', goHome);
    homeLogo.addEventListener('click', goHome);

    registerButton.addEventListener('click', () => {
        window.location.href = './register.html';
    });


    // =========================================================
    // عرض رسالة الخطأ
    // =========================================================

    function showError(message) {
        errorBox.textContent = message;
        errorBox.style.display = 'block';
    }

    function hideError() {
        errorBox.style.display = 'none';
        errorBox.textContent = '';
    }


    // =========================================================
    // التحقق من وجود جلسة سابقة
    // =========================================================

    async function checkExistingSession() {
        const { data: { session } } = await supabase.auth.getSession();
        if (session) {
            window.location.replace('../dashboard/dashboard.html');
        }
    }

    checkExistingSession();


    // =========================================================
    // عملية تسجيل الدخول
    // =========================================================

    loginForm.addEventListener('submit', async (e) => {

        e.preventDefault();

        hideError();


        const email = emailInput.value.trim();
        const password = passwordInput.value;


        if (!email || !password) {
            showError('يرجى إدخال البريد الإلكتروني وكلمة المرور.');
            return;
        }


        // تعطيل الزر لتجنب التكرار

        submitButton.disabled = true;
        submitButton.textContent = 'جاري التحقق...';


        try {

            const { data, error } = await supabase.auth.signInWithPassword({
                email: email,
                password: password
            });


            if (error) {

                // معالجة الأخطاء الشائعة بالعربية

                if (error.message.includes('Invalid login credentials')) {
                    throw new Error('البريد الإلكتروني أو كلمة المرور غير صحيحة.');
                } else if (error.message.includes('Email not confirmed')) {
                    throw new Error('لم يتم تأكيد البريد الإلكتروني بعد.');
                } else {
                    throw error;
                }

            }


            // التوجيه المباشر إلى لوحة التحكم بعد النجاح

            if (data.session) {
                window.location.replace('../dashboard/dashboard.html');
            }


        } catch (err) {

            console.error('Login error:', err);

            showError(err.message || 'حدث خطأ أثناء تسجيل الدخول.');

            submitButton.disabled = false;
            submitButton.textContent = 'تسجيل الدخول';

        }

    });

</script>


</body>

</html>
