<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Physics Quiz - Alpha Academy</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- MathJax for rendering LaTeX formulas -->
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0b0f19 0%, #111827 50%, #0d1527 100%);
            --card-bg: rgba(17, 24, 39, 0.75);
            --card-border: rgba(255, 255, 255, 0.08);
            --primary: #6366f1;
            --primary-glow: rgba(99, 102, 241, 0.35);
            --primary-hover: #4f46e5;
            --accent: #38bdf8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --correct: #10b981;
            --correct-bg: rgba(16, 185, 129, 0.12);
            --correct-border: rgba(16, 185, 129, 0.4);
            --incorrect: #f43f5e;
            --incorrect-bg: rgba(244, 63, 94, 0.12);
            --incorrect-border: rgba(244, 63, 94, 0.4);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', 'Tajawal', sans-serif;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
        }

        /* Ambient Background Glows */
        .ambient-glow {
            position: fixed;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            background: radial-gradient(circle, var(--primary-glow) 0%, rgba(0,0,0,0) 70%);
            top: -100px;
            right: -100px;
            z-index: 0;
            pointer-events: none;
        }
        .ambient-glow-2 {
            position: fixed;
            width: 350px;
            height: 350px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(56, 189, 248, 0.15) 0%, rgba(0,0,0,0) 70%);
            bottom: -80px;
            left: -80px;
            z-index: 0;
            pointer-events: none;
        }

        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 720px;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 24px;
            padding: 36px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            border: 1px solid var(--card-border);
            transition: all 0.3s ease;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--card-border);
        }

        .header-title {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-icon {
            width: 42px;
            height: 42px;
            background: rgba(99, 102, 241, 0.15);
            border: 1px solid rgba(99, 102, 241, 0.3);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent);
            font-size: 1.2rem;
        }

        .header h1 {
            font-size: 1.3rem;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .header p {
            color: var(--text-muted);
            font-size: 0.82rem;
        }

        /* Progress Bar */
        .progress-container {
            margin-bottom: 28px;
        }

        .progress-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            font-size: 0.88rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        .progress-bar-bg {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--primary) 0%, var(--accent) 100%);
            border-radius: 10px;
            transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 0 12px var(--primary-glow);
        }

        /* Questions Block */
        .question-card {
            animation: fadeIn 0.4s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .question-text {
            font-size: 1.15rem;
            font-weight: 600;
            line-height: 1.6;
            margin-bottom: 24px;
            direction: ltr;
            text-align: left;
            color: #ffffff;
        }

        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 14px;
            direction: ltr;
        }

        .option-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            padding: 16px 20px;
            color: var(--text-main);
            font-size: 0.98rem;
            cursor: pointer;
            text-align: left;
            transition: all 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
        }

        .option-btn .opt-content {
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 1;
        }

        .option-btn .opt-badge {
            width: 28px;
            height: 28px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.06);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-muted);
            transition: all 0.2s;
        }

        .option-btn:hover:not([disabled]) {
            background: rgba(99, 102, 241, 0.08);
            border-color: rgba(99, 102, 241, 0.4);
            transform: translateX(4px);
        }

        .option-btn:hover:not([disabled]) .opt-badge {
            background: var(--primary);
            color: #fff;
        }

        .option-btn.correct {
            background: var(--correct-bg) !important;
            border-color: var(--correct-border) !important;
            color: #d1fae5;
        }

        .option-btn.correct .opt-badge {
            background: var(--correct);
            color: #fff;
        }

        .option-btn.incorrect {
            background: var(--incorrect-bg) !important;
            border-color: var(--incorrect-border) !important;
            color: #ffe4e6;
        }

        .option-btn.incorrect .opt-badge {
            background: var(--incorrect);
            color: #fff;
        }

        .status-icon {
            font-size: 1.1rem;
            opacity: 0;
            transform: scale(0.5);
            transition: all 0.25s ease;
        }

        .option-btn.correct .status-icon, .option-btn.incorrect .status-icon {
            opacity: 1;
            transform: scale(1);
        }

        /* Explanation Box */
        .explanation {
            margin-top: 20px;
            padding: 16px 20px;
            background: rgba(255, 255, 255, 0.02);
            border-left: 3px solid var(--accent);
            border-radius: 12px;
            font-size: 0.92rem;
            line-height: 1.6;
            color: var(--text-muted);
            display: none;
            direction: ltr;
            text-align: left;
            animation: fadeIn 0.3s ease;
        }

        .explanation strong {
            color: var(--accent);
            display: block;
            margin-bottom: 4px;
        }

        /* Action Buttons */
        .actions {
            display: flex;
            justify-content: flex-end;
            margin-top: 28px;
        }

        .btn {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-hover) 100%);
            color: white;
            border: none;
            padding: 12px 28px;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 4px 15px var(--primary-glow);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn:hover:not([disabled]) {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.5);
        }

        .btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }

        /* Luxurious Result Card Screen */
        .result-card {
            text-align: center;
            display: none;
            padding: 10px 0;
            animation: fadeIn 0.5s ease;
        }

        .score-circle-wrapper {
            position: relative;
            width: 150px;
            height: 150px;
            margin: 0 auto 24px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .score-circle-svg {
            transform: rotate(-90deg);
            width: 100%;
            height: 100%;
        }

        .score-circle-bg {
            fill: none;
            stroke: rgba(255, 255, 255, 0.06);
            stroke-width: 8;
        }

        .score-circle-progress {
            fill: none;
            stroke: var(--accent);
            stroke-width: 8;
            stroke-dasharray: 440;
            stroke-dashoffset: 440;
            stroke-linecap: round;
            transition: stroke-dashoffset 1.2s cubic-bezier(0.4, 0, 0.2, 1);
            filter: drop-shadow(0 0 8px var(--accent));
        }

        .score-content {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .score-percentage {
            font-size: 2.2rem;
            font-weight: 800;
            color: #fff;
            line-height: 1;
        }

        .score-sub {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .result-card h2 {
            font-size: 1.6rem;
            margin-bottom: 8px;
            color: #fff;
        }

        .result-badge {
            display: inline-block;
            padding: 6px 16px;
            background: rgba(56, 189, 248, 0.1);
            border: 1px solid rgba(56, 189, 248, 0.2);
            border-radius: 20px;
            color: var(--accent);
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 24px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 14px;
            margin-bottom: 28px;
            direction: rtl;
        }

        .stat-item {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            padding: 16px;
            text-align: center;
        }

        .stat-value {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .stat-value.correct-val { color: var(--correct); }
        .stat-value.incorrect-val { color: var(--incorrect); }

        .stat-label {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        @media (max-width: 580px) {
            .container { padding: 24px 20px; }
            .header h1 { font-size: 1.1rem; }
            .question-text { font-size: 1rem; }
            .option-btn { padding: 14px 16px; font-size: 0.9rem; }
        }
    </style>
</head>
<body>

<div class="ambient-glow"></div>
<div class="ambient-glow-2"></div>

<div class="container">
    <!-- Header -->
    <div class="header">
        <div class="header-title">
            <div class="header-icon">
                <i class="fa-solid fa-atom"></i>
            </div>
            <div>
                <h1>Physics Quiz</h1>
                <p>Units, Dimensions & Measurement</p>
            </div>
        </div>
    </div>

    <!-- Quiz Main Interface -->
    <div id="quiz-box">
        <div class="progress-container">
            <div class="progress-info">
                <span id="question-count">السؤال 1 من 7</span>
                <span id="progress-percent">0%</span>
            </div>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="progress-fill"></div>
            </div>
        </div>

        <div class="question-card">
            <div class="question-text" id="question-text"></div>
            <div class="options-grid" id="options-container"></div>
            <div class="explanation" id="explanation"></div>
        </div>

        <div class="actions">
            <button class="btn" id="next-btn" onclick="nextQuestion()" disabled>
                <span>السؤال التالي</span>
                <i class="fa-solid fa-arrow-left"></i>
            </button>
        </div>
    </div>

    <!-- Luxurious Result Screen -->
    <div class="result-card" id="result-box">
        <div class="score-circle-wrapper">
            <svg class="score-circle-svg" viewBox="0 0 150 150">
                <circle class="score-circle-bg" cx="75" cy="75" r="65"></circle>
                <circle class="score-circle-progress" id="circle-progress" cx="75" cy="75" r="65"></circle>
            </svg>
            <div class="score-content">
                <span class="score-percentage" id="score-percentage">0%</span>
                <span class="score-sub" id="score-sub-text">0 من 7</span>
            </div>
        </div>

        <h2 id="result-title">نتيجة الاختبار</h2>
        <div class="result-badge" id="result-status">ممتاز! أداء استثنائي</div>

        <div class="stats-grid">
            <div class="stat-item">
                <div class="stat-value correct-val" id="stat-correct">0</div>
                <div class="stat-label">الإجابات الصحيحة</div>
            </div>
            <div class="stat-item">
                <div class="stat-value incorrect-val" id="stat-incorrect">0</div>
                <div class="stat-label">الإجابات الخاطئة</div>
            </div>
        </div>

        <button class="btn" onclick="restartQuiz()" style="margin: 0 auto;">
            <i class="fa-solid fa-rotate-right"></i>
            <span>إعادة الاختبار</span>
        </button>
    </div>
</div>

<script>
    const questions = [
        {
            question: "Which derived unit is used to express pressure in the International System?",
            options: [
                "watt ($W$)",
                "newton ($N$)",
                "pascal ($Pa$)",
                "joule ($J$)"
            ],
            correct: 2,
            explanation: "Pascal ($Pa$) is the SI derived unit of pressure, equivalent to one newton per square meter ($N/m^2$)."
        },
        {
            question: "What is the dimensional formula for mass density as derived from base units?",
            options: [
                "$ML^3$",
                "$ML^{-3}$",
                "$ML^{-1}$",
                "$ML^{-2}$"
            ],
            correct: 1,
            explanation: "Mass density = $\\frac{\\text{Mass}}{\\text{Volume}} = \\frac{M}{L^3} = ML^{-3}$."
        },
        {
            question: "In dimensional analysis, what is the standard symbol used to represent the dimension of 'Amount of substance'?",
            options: [
                "$N$",
                "$A$",
                "$n$",
                "$M$"
            ],
            correct: 0,
            explanation: "In the SI dimensional representation, $N$ is used for the Amount of Substance."
        },
        {
            question: "If an equation is given as $s = vt^2 + 0.5at$, why is it considered dimensionally incorrect?",
            options: [
                "Velocity and time cannot be multiplied together.",
                "The constant 0.5 has no dimensions.",
                "The acceleration term must always be squared.",
                "The terms $vt^2$ and $0.5at$ have different dimensions from each other and from $s$."
            ],
            correct: 3,
            explanation: "$[s] = L$, $[vt^2] = (LT^{-1})T^2 = LT$, and $[0.5at] = (LT^{-2})T = LT^{-1}$. Since terms added together have different dimensions, the equation is incorrect."
        },
        {
            question: "According to the provided applications of dimensional analysis, which task involves ensuring all terms in an equation have the same dimensions?",
            options: [
                "Unit Conversion",
                "Checking Equations",
                "Constant Dimensioning",
                "Relation Discovery"
            ],
            correct: 1,
            explanation: "Checking the homogeneity/correctness of equations requires verifying that all terms have identical dimensions."
        },
        {
            question: "Which metric prefix represents the multiplier $10^9$?",
            options: [
                "giga",
                "tera",
                "mega",
                "peta"
            ],
            correct: 0,
            explanation: "Giga ($G$) corresponds to $10^9$."
        },
        {
            question: "The period of a simple pendulum is given by $\\tau = k \\sqrt{\\frac{l}{g}}$. If $\\beta$ is the power of length $l$ and $\\gamma$ is the power of gravity $g$, which values satisfy dimensional consistency for the period $T$?",
            options: [
                "$\\beta = \\frac{1}{2}, \\gamma = -\\frac{1}{2}$",
                "$\\beta = 0, \\gamma = 1$",
                "$\\beta = 1, \\gamma = -1$",
                "$\\beta = -\\frac{1}{2}, \\gamma = \\frac{1}{2}$"
            ],
            correct: 0,
            explanation: "$\\tau = k l^{\\beta} g^{\\gamma} \\Rightarrow T = L^{\\beta} (LT^{-2})^{\\gamma} = L^{\\beta+\\gamma} T^{-2\\gamma}$. Equating powers gives $\\gamma = -1/2$ and $\\beta = 1/2$."
        }
    ];

    let currentIdx = 0;
    let score = 0;
    let answered = false;

    function loadQuestion() {
        answered = false;
        document.getElementById('next-btn').disabled = true;
        document.getElementById('explanation').style.display = 'none';

        const q = questions[currentIdx];
        
        // Progress calculations
        const progressPct = Math.round(((currentIdx) / questions.length) * 100);
        document.getElementById('question-count').innerText = `السؤال ${currentIdx + 1} من ${questions.length}`;
        document.getElementById('progress-percent').innerText = `${progressPct}%`;
        document.getElementById('progress-fill').style.width = `${progressPct}%`;

        document.getElementById('question-text').innerHTML = q.question;

        const container = document.getElementById('options-container');
        container.innerHTML = '';

        q.options.forEach((opt, idx) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerHTML = `
                <div class="opt-content">
                    <span class="opt-badge">${String.fromCharCode(65 + idx)}</span>
                    <span>${opt}</span>
                </div>
                <i class="fa-solid status-icon"></i>
            `;
            btn.onclick = () => selectOption(idx);
            container.appendChild(btn);
        });

        if (window.MathJax) {
            MathJax.typesetPromise();
        }
    }

    function selectOption(idx) {
        if (answered) return;
        answered = true;

        const q = questions[currentIdx];
        const buttons = document.querySelectorAll('.option-btn');

        if (idx === q.correct) {
            buttons[idx].classList.add('correct');
            buttons[idx].querySelector('.status-icon').classList.add('fa-circle-check');
            score++;
        } else {
            buttons[idx].classList.add('incorrect');
            buttons[idx].querySelector('.status-icon').classList.add('fa-circle-xmark');
            
            buttons[q.correct].classList.add('correct');
            buttons[q.correct].querySelector('.status-icon').classList.add('fa-circle-check');
        }

        buttons.forEach(btn => btn.disabled = true);

        const exp = document.getElementById('explanation');
        exp.innerHTML = `<strong>Explanation:</strong> ${q.explanation}`;
        exp.style.display = 'block';

        document.getElementById('next-btn').disabled = false;

        if (window.MathJax) {
            MathJax.typesetPromise();
        }
    }

    function nextQuestion() {
        currentIdx++;
        if (currentIdx < questions.length) {
            loadQuestion();
        } else {
            showResult();
        }
    }

    function showResult() {
        document.getElementById('quiz-box').style.display = 'none';
        const resBox = document.getElementById('result-box');
        resBox.style.display = 'block';

        const total = questions.length;
        const percentage = Math.round((score / total) * 100);

        document.getElementById('score-percentage').innerText = `${percentage}%`;
        document.getElementById('score-sub-text').innerText = `${score} من ${total}`;
        document.getElementById('stat-correct').innerText = score;
        document.getElementById('stat-incorrect').innerText = total - score;

        // Circle animation calculation
        const circleProgress = document.getElementById('circle-progress');
        const circumference = 2 * Math.PI * 65; // r = 65
        const offset = circumference - (percentage / 100) * circumference;
        
        setTimeout(() => {
            circleProgress.style.strokeDasharray = `${circumference}`;
            circleProgress.style.strokeDashoffset = `${offset}`;
        }, 100);

        // Performance Status
        const statusBadge = document.getElementById('result-status');
        if (percentage >= 85) {
            statusBadge.innerText = 'ممتاز! أداء استثنائي 🚀';
            statusBadge.style.color = '#10b981';
            statusBadge.style.borderColor = 'rgba(16, 185, 129, 0.3)';
        } else if (percentage >= 60) {
            statusBadge.innerText = 'جيد جداً! استمر في التحسن 👍';
            statusBadge.style.color = '#38bdf8';
            statusBadge.style.borderColor = 'rgba(56, 189, 248, 0.3)';
        } else {
            statusBadge.innerText = 'تحتاج لمراجعة بعض المفاهيم 📚';
            statusBadge.style.color = '#f43f5e';
            statusBadge.style.borderColor = 'rgba(244, 63, 94, 0.3)';
        }
    }

    function restartQuiz() {
        currentIdx = 0;
        score = 0;
        document.getElementById('quiz-box').style.display = 'block';
        document.getElementById('result-box').style.display = 'none';
        
        // Reset SVG Progress Circle
        const circleProgress = document.getElementById('circle-progress');
        const circumference = 2 * Math.PI * 65;
        circleProgress.style.strokeDashoffset = `${circumference}`;

        loadQuestion();
    }

    // Initialize quiz on load
    loadQuestion();
</script>
</body>
</html>
